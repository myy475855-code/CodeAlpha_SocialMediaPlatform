{% extends "base.html" %}
{% block title %}Edit profile · Tidepool{% endblock %}
{% block content %}
<header class="page-head"><h1>Edit profile</h1></header>
<form class="form" method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
  </div>
  {% endfor %}
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a class="btn btn-quiet" href="{% url 'profile' user.username %}">Cancel</a>
  </div>
</form>
{% endblock %}
