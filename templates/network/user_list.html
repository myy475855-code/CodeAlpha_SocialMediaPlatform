{% extends "base.html" %}
{% block title %}{{ title }} · {{ owner.username }}{% endblock %}
{% block content %}
<header class="page-head">
  <h1>{{ title }}</h1>
  <a class="muted" href="{% url 'profile' owner.username %}">@{{ owner.username }}</a>
</header>
{% for person in people %}
  {% include "network/_user_card.html" %}
{% empty %}
  <div class="empty"><p>Nobody here yet.</p></div>
{% endfor %}
{% endblock %}
